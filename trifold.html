<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Bearly Technical Fold-out Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Fold-out pocket card: flat 10.5 x 2 in, folds in thirds to 3.5 x 2 in.
   Page 1 = outside (left: tuck-in flap, middle: back, right: front cover). Page 2 = inside.
   Letter landscape, 4 per sheet. Print double-sided, flip on SHORT edge, heavy cardstock, 100% scale.
   Cut on the outer marks, then fold the right panel (cover) over, and the left flap tucks in behind it. */
@page{size:11in 8.5in;margin:0}
:root{--blue:#2a5ca5;--gold:#f2b51a;--cream:#f4ecdf;--night:#0b1733;--ink:#131a2c}
*{box-sizing:border-box;margin:0}
html,body{background:#fff;font-family:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;color:var(--ink)}
.page{width:11in;height:8.5in;position:relative;page-break-after:always;overflow:hidden}
.stack{position:absolute;left:0.25in;top:0.25in;width:10.5in;display:grid;grid-template-rows:repeat(4,2in)}
.strip{display:grid;grid-template-columns:3.5in 3.5in 3.5in;height:2in}
.p{position:relative;overflow:hidden;padding:0.16in 0.18in}
.mark{position:absolute;background:#888}
.h{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;line-height:.92;letter-spacing:.015em;text-transform:uppercase}

/* OUTSIDE */
.flap{background:var(--cream) url(img/card-paper.jpg) left center/auto 100% no-repeat}
.flap .h{font-size:15pt;color:var(--blue)}
.flap .big{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:30pt;line-height:.9;color:var(--night);margin-top:.08in}
.flap .big span{color:var(--gold);-webkit-text-stroke:0.6px #b88300}
.flap .who{font-size:7.4pt;line-height:1.35;margin-top:.05in;color:#3b4560}
.flap .partner{position:absolute;left:.18in;right:.18in;bottom:.14in;font-size:6.8pt;line-height:1.3;color:var(--blue);font-weight:700;border-top:1px solid #d9ccb5;padding-top:.05in}

.back{background:var(--cream) url(img/card-paper.jpg) right center/auto 100% no-repeat;display:grid;grid-template-columns:auto 1fr;gap:.14in;align-items:center;border-left:1px solid #e3d8c4}
.back .qrbox{width:1.42in;height:1.42in;background:#fff;border-radius:.09in;padding:.09in;box-shadow:inset 0 0 0 .03in var(--night)}
.back .qr img,.back .qr canvas{width:100%!important;height:100%!important;display:block}
.back .scan{font-size:11pt;color:var(--blue)}
.back .label{font-size:6pt;letter-spacing:.14em;text-transform:uppercase;color:#6a6f7d;margin-top:.12in}
.back .phone{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:15.5pt;white-space:nowrap;color:var(--night);line-height:1;margin-top:.02in}
.back .stripe{position:absolute;left:0;right:0;bottom:0;height:.06in;background:var(--gold)}

.cover{background:var(--night) url(img/card-cover.jpg) center 70%/cover no-repeat;color:#fff}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover .logo{position:absolute;left:.17in;top:.29in;width:1.38in;height:1.38in;border-radius:50%;box-shadow:0 0 0 .033in var(--gold),0 0 .18in rgba(242,181,26,.35)}
.cover .words{position:absolute;left:1.74in;top:.4in;right:.12in}
.cover .brand{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:23pt;line-height:.86;text-transform:uppercase}
.cover .brand span{color:var(--gold)}
.cover .rule{width:.5in;height:.033in;background:var(--gold);margin:.08in 0 .06in}
.cover .tag{font-size:7pt;line-height:1.3;color:#cfd8ec}
.cover .open{position:absolute;right:.14in;bottom:.12in;font-size:6pt;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* INSIDE */
.in-strip{background:var(--cream) url(img/card-paper.jpg) center/cover no-repeat}
.in{background:transparent;border-right:1px solid rgba(160,140,110,.35)}
.in:nth-child(2){background:rgba(232,219,196,.45)}
.in:last-child{border-right:0}
.in .num{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:9pt;color:var(--gold);letter-spacing:.1em}
.in .h{font-size:15pt;color:var(--blue);margin-top:.01in}
.in .lede{font-size:6.8pt;color:#4a5370;margin:.04in 0 .07in}
.in ul{list-style:none;padding:0;display:grid;gap:.045in}
.in li{font-size:7.6pt;line-height:1.2;padding-left:.13in;position:relative}
.in li::before{content:"";position:absolute;left:0;top:.045in;width:.055in;height:.055in;background:var(--gold);transform:rotate(45deg)}
@media screen{body{background:#cfcfcf}.page{margin:16px auto;background:#fff;box-shadow:0 2px 12px #0003}}
</style></head><body>

<template id="outside">
  <div class="strip">
    <div class="p flap">
      <div class="h">Neighbor pricing</div>
      <div class="big"><span>50%</span> off</div>
      <div class="who">for small and local businesses<br>and startups. Small local startups: <b>75% off</b>.</div>
      <div class="partner">Or one monthly plan, and I'm your tech partner for all of it.</div>
    </div>
    <div class="p back">
      <div class="qrbox"><div class="qr"></div></div>
      <div>
        <div class="h scan">Scan to see<br>what I can do</div>
        <div class="label">Call or text</div>
        <div class="phone">828-740-0010</div>
      </div>
      <div class="stripe"></div>
    </div>
    <div class="p cover">
      <img class="logo" src="img/badge.png" alt="Bearly Technical bear badge">
      <div class="words">
        <div class="brand">Bearly<br><span>Technical</span></div>
        <div class="rule"></div>
        <div class="tag">Your tech partner</div>
      </div>
      <div class="open">Open me &rarr;</div>
    </div>
  </div>
</template>

<template id="inside">
  <div class="strip in-strip">
    <div class="p in">
      <div class="num">01</div>
      <div class="h">Get found</div>
      <div class="lede">So Google and Maps send people to your door.</div>
      <ul>
        <li>A website with your real photos and reviews</li>
        <li>Google listing and review kit</li>
        <li>Social media set up right</li>
        <li>Flyers and QR codes for your counter</li>
      </ul>
    </div>
    <div class="p in">
      <div class="num">02</div>
      <div class="h">Run smoother</div>
      <div class="lede">Less phone tag. Nothing falls through.</div>
      <ul>
        <li>Online booking, quotes and order forms</li>
        <li>A helper bot for your common questions</li>
        <li>Email, payments and bookkeeping set up</li>
        <li>Reminders and reports that send themselves</li>
      </ul>
    </div>
    <div class="p in">
      <div class="num">03</div>
      <div class="h">Nonprofits &amp; churches</div>
      <div class="lede">Find the money, then get it.</div>
      <ul>
        <li>Free grant readiness report</li>
        <li>Grant applications, written with you</li>
        <li>Donation and volunteer pages</li>
        <li>Walmart Spark Good setup</li>
      </ul>
    </div>
  </div>
</template>

<div class="page"><div class="stack" id="s1"></div></div>
<div class="page"><div class="stack" id="s2"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
for(let i=0;i<4;i++){
  const o=document.getElementById("outside").content.cloneNode(true);
  new QRCode(o.querySelector(".qr"),{text:"https://jrns-hub.github.io/bearly-technical/",width:400,height:400,colorDark:"#0b1733",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.Q});
  document.getElementById("s1").appendChild(o);
  document.getElementById("s2").appendChild(document.getElementById("inside").content.cloneNode(true));
}
// cut marks in the margins: left/right edges and between strips; fold marks top/bottom at 3.5 and 7 in
document.querySelectorAll(".page").forEach(pg=>{
  const add=(l,t,w,h)=>{const m=document.createElement("div");m.className="mark";Object.assign(m.style,{left:l+"in",top:t+"in",width:w+"in",height:h+"in"});pg.appendChild(m)};
  [0.25,2.25,4.25,6.25,8.25].forEach(y=>{add(0.02,y-0.004,0.18,0.008);add(10.8,y-0.004,0.18,0.008)});
  [0.25,10.75].forEach(x=>{add(x-0.004,0.02,0.008,0.18);add(x-0.004,8.3,0.008,0.18)});
  [3.75,7.25].forEach(x=>{const t=document.createElement("div");t.className="mark";Object.assign(t.style,{left:(x-0.003)+"in",top:"0.06in",width:"0.006in",height:"0.12in",background:"#bbb"});pg.appendChild(t)});
});
</script>
</body></html>
