<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Bearly Technical Business Cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Two-sided 3.5 x 2 in cards, 10 per US Letter sheet. Page 1 = fronts, page 2 = backs.
   Print double-sided, flip on LONG edge, heavy cardstock, 100% scale. Cards touch each other and the color runs
   1/16 in past the outer cut lines (bleed), so cutting on the crop marks leaves no white edges. */
@page{size:letter;margin:0}
:root{--blue:#2a5ca5;--gold:#f2b51a;--cream:#f4ecdf;--night:#0b1733;--ink:#131a2c}
*{box-sizing:border-box;margin:0}
html,body{background:#fff}
.page{width:8.5in;height:11in;position:relative;page-break-after:always;overflow:hidden}
.grid{position:absolute;left:0.75in;top:0.5in;width:7in;height:10in;display:grid;grid-template-columns:3.5in 3.5in;grid-template-rows:repeat(5,2in)}
.bleed{position:absolute;left:calc(0.75in - 0.0625in);top:calc(0.5in - 0.0625in);width:calc(7in + 0.125in);height:calc(10in + 0.125in)}
.fronts .bleed{background:var(--night)}.backs .bleed{background:var(--cream)}
/* crop marks */
.mark{position:absolute;background:#777}
.card{position:relative;width:3.5in;height:2in;overflow:hidden;font-family:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif}

/* FRONT */
.front{background:var(--night) url(img/card-cover.jpg) center 70%/cover no-repeat;color:var(--cream)}
.front svg.sky{position:absolute;inset:0;width:100%;height:100%}
.front .logo{position:absolute;left:0.2in;top:0.28in;width:1.44in;height:1.44in;border-radius:50%;box-shadow:0 0 0 0.035in var(--gold),0 0 0.18in rgba(242,181,26,.35)}
.front .words{position:absolute;left:1.86in;top:0.36in;right:0.14in}
.front .brand{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:25pt;line-height:.86;letter-spacing:.015em;color:#fff;text-transform:uppercase}
.front .brand span{color:var(--gold)}
.front .rule{width:0.55in;height:0.035in;background:var(--gold);margin:0.09in 0 0.07in}
.front .tag{font-size:7.4pt;line-height:1.3;color:#cfd8ec;letter-spacing:.02em}

/* BACK */
.back{background:var(--cream) url(img/card-paper.jpg) center/cover no-repeat;color:var(--ink)}
.back .qrbox{position:absolute;left:0.18in;top:0.2in;width:1.6in;height:1.6in;background:#fff;border-radius:0.1in;padding:0.1in;box-shadow:inset 0 0 0 0.03in var(--night)}
.back .qr img,.back .qr canvas{width:100%!important;height:100%!important;display:block}
.back .qrbox .cap{position:absolute;left:0;right:0;bottom:-0.005in;transform:translateY(100%);text-align:center;font-size:5.6pt;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);font-weight:700;display:none}
.back .info{position:absolute;left:1.98in;top:0.24in;right:0.14in}
.back .scan{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:12.5pt;line-height:1;color:var(--blue);text-transform:uppercase;letter-spacing:.02em}
.back .label{font-size:6.2pt;letter-spacing:.14em;text-transform:uppercase;color:#6a6f7d;margin-top:0.13in}
.back .phone{white-space:nowrap;font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:17pt;line-height:1;color:var(--night);letter-spacing:.01em;margin-top:0.02in}
.back .list{font-size:6.5pt;line-height:1.35;color:#3b4560;margin-top:0.1in}
.back .stripe{position:absolute;left:0;right:0;bottom:0;height:0.07in;background:var(--gold)}
.back .mini{position:absolute;right:0.14in;top:0.16in;width:0.32in;height:0.32in;border-radius:50%;opacity:.95}
@media screen{body{background:#cfcfcf}.page{margin:18px auto;background:#fff;box-shadow:0 2px 14px #0003}}
</style></head><body>

<template id="front">
  <div class="card front">
    <img class="logo" src="img/badge.png" alt="Bearly Technical bear badge">
    <div class="words">
      <div class="brand">Bearly<br><span>Technical</span></div>
      <div class="rule"></div>
      <div class="tag">Your tech partner in the<br>Swannanoa Valley</div>
    </div>
  </div>
</template>

<template id="back">
  <div class="card back">
    <div class="qrbox"><div class="qr"></div></div>
    <div class="info">
      <div class="scan">Scan to see<br>what I can do</div>
      <div class="label">Call or text</div>
      <div class="phone">828-740-0010</div>
      <div class="list">Websites &middot; Google &amp; reviews<br>AI helpers &middot; Booking &middot; Grants</div>
    </div>
    <div class="stripe"></div>
  </div>
</template>

<div class="page fronts"><div class="bleed"></div><div class="grid" id="g1"></div></div>
<div class="page backs"><div class="bleed"></div><div class="grid" id="g2"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const URL_="https://jrns-hub.github.io/bearly-technical/";
for(let i=0;i<10;i++){
  document.getElementById("g1").appendChild(document.getElementById("front").content.cloneNode(true));
  const b=document.getElementById("back").content.cloneNode(true);
  new QRCode(b.querySelector(".qr"),{text:URL_,width:400,height:400,colorDark:"#0b1733",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.Q});
  document.getElementById("g2").appendChild(b);
}
// crop marks just outside the bleed, at every cut line
document.querySelectorAll(".page").forEach(pg=>{
  const add=(l,t,w,h)=>{const m=document.createElement("div");m.className="mark";Object.assign(m.style,{left:l+"in",top:t+"in",width:w+"in",height:h+"in"});pg.appendChild(m)};
  [0.75,4.25,7.75].forEach(x=>{add(x-0.004,0.12,0.008,0.25);add(x-0.004,10.63,0.008,0.25)});
  [0.5,2.5,4.5,6.5,8.5,10.5].forEach(y=>{add(0.38,y-0.004,0.25,0.008);add(7.87,y-0.004,0.25,0.008)});
});
</script>
</body></html>
